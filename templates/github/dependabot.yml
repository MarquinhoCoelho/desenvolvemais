# .github/dependabot.yml — o GitHub abre PRs atualizando dependências (grátis, inclusive em repositório privado).
# Cada PR passa pela CI normal; se os testes passarem, é seguro mesclar.
# O Claude ajusta o "package-ecosystem": npm | pip | composer | maven | gradle | docker | ...
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
